media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    filename: '{fields.slug}'
    extension: md
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: pubDate
        label: Publication Date
        type: date
      - name: heroImage
        label: Hero Image
        type: image
      - name: slug
        label: URL Slug (lowercase-with-hyphens)
        type: string
      - name: body
        label: Post Body
        type: rich-text

